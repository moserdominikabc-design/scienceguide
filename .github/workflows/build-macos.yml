name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: scienceguide_excel_cleaner

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "ScienceGuide Excel Cleaner" \
            --osx-bundle-identifier "ch.scnat.scienceguide.excelcleaner" \
            app.py

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ScienceGuide Excel Cleaner.app" \
            "dist/ScienceGuide-Excel-Cleaner-macOS.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: ScienceGuide-Excel-Cleaner-macOS
          path: scienceguide_excel_cleaner/dist/ScienceGuide-Excel-Cleaner-macOS.zip
          if-no-files-found: error
